<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/index_login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <title>Rincón del Sabor</title>
</head>
<body>
    <div class="sesion-cont">
        <h2>Iniciar Sesión</h2>
        <form action="html/panel_principal.html">
            <div class="campo">
                <div class="entrada">
                    <img src="multimedia/email.svg" alt="Icono email">
                    <input type="text" placeholder="Correo Electrónico">
                </div>
            </div>
            <div class="campo">
                <div class="entrada">
                    <img src="multimedia/password.svg" alt="Icono Contraseña">
                    <input type="password" placeholder="Contraseña">
                </div>
            </div>
            <button type="submit" id="ingresar">Ingresar</button>
        </form>
    </div>
</body>
</html>
